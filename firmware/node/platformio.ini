; Acoustic node firmware: ESP32-S3-DevKitC-1, 2 x INMP441, USB serial link to the Pi.
; Build:   pio run
; Flash:   pio run -t upload        (use the port labelled USB on the DevKit: the S3's native USB)
; Monitor: python ../../host/tools/monitor.py   (the stream is binary, so pio monitor shows noise)

[env:node]
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = espidf
upload_speed = 921600
monitor_speed = 2000000
