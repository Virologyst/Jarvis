[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-brain"
version = "0.1.0"
description = "Jarvis brain: speech-to-text, Claude, text-to-speech, tools"
requires-python = ">=3.11"
# jarvis-protocol is installed from ../protocol by the install scripts.
dependencies = [
    "anthropic",
    "aiohttp>=3.9",
    "numpy",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
]

[project.optional-dependencies]
# NVIDIA GPU speech-to-text without installing the CUDA toolkit: pip install -e brain[gpu]
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
jarvis-brain = "jarvis_brain.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis_brain*"]
